<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Command Center</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app-shell" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span id="brand-name">Farhan's Command Center</span>
    </div>
    <div class="topbar-actions">
      <span id="sync-badge" class="pill" title="sync status">—</span>
      <input id="search" type="search" placeholder="Search everything…" autocomplete="off">
      <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<!-- login -->
<div id="login" class="login-wrap" hidden>
  <form id="login-form" class="login-card">
    <div class="login-head">
      <div class="logo-sq">F</div>
      <span class="brand-pill"><span class="brand-dot"></span>FARHAN</span>
    </div>
    <h2 class="login-title">Command Center</h2>
    <p class="login-sub">Your dashboard — synced on every device.</p>
    <label class="field">
      <span>Passcode</span>
      <input type="password" name="passcode" placeholder="Enter your passcode" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button class="login-submit" type="submit">Unlock</button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<!-- Settings -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3>Settings</h3>
    <p class="muted">Synced to Cloudflare D1. localStorage keeps an offline mirror on this device.</p>
    <div class="row">
      <button id="btn-export" class="btn">⬇ Export JSON</button>
      <button id="btn-import" class="btn">⬆ Import JSON</button>
      <button id="btn-sync" class="btn">⟳ Sync now</button>
      <input id="file-import" type="file" accept="application/json" hidden>
    </div>
    <div class="row">
      <label class="muted">Rename dashboard</label>
      <input id="set-title" type="text" placeholder="Farhan's Command Center">
    </div>
    <hr class="sep">
    <form id="passcode-form">
      <label class="muted">Change passcode (min 8 characters)</label>
      <input type="password" name="next" placeholder="New passcode" autocomplete="new-password" required>
      <div class="row"><button class="btn" type="submit">Update passcode</button></div>
    </form>
    <hr class="sep">
    <div class="row right">
      <button id="btn-wipe" class="btn danger">Erase all data</button>
      <button id="btn-logout" class="btn">Sign out</button>
      <button id="btn-close" class="btn primary">Done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
